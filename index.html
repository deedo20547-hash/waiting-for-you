<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100b1b">
  <title>เวลาที่เรายังคงรอ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="heart" aria-hidden="true">♥</div>
      <p class="eyebrow">A LITTLE SPACE FOR HOPE</p>
      <h1>เวลาที่เรายังคงรอ</h1>
      <p class="sub">ทุกวินาทีเดินไปข้างหน้า อย่าลืมดูแลหัวใจตัวเองด้วยนะ</p>

      <div class="timer" aria-live="off">
        <div class="unit"><strong id="days">0</strong><span>วัน</span></div>
        <div class="unit"><strong id="hours">00</strong><span>ชั่วโมง</span></div>
        <div class="unit"><strong id="minutes">00</strong><span>นาที</span></div>
        <div class="unit"><strong id="seconds">00</strong><span>วินาที</span></div>
      </div>

      <div class="rule"></div>
      <p class="start-label">เริ่มนับตั้งแต่</p>
      <p class="start-date" id="start-date">24 พฤศจิกายน 2026 · 23:19:55 น.</p>
      <p class="note">ไม่รู้ว่าปลายทางจะเป็นอย่างไร แต่ระหว่างทางก็อย่าลืมรักตัวเอง</p>
      <button id="logout" class="logout" type="button">ออกจากระบบ</button>
    </section>
    <footer>พื้นที่ส่วนตัวของคุณ</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
